<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Notes Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <h1>Release Notes Gen</h1>
            </div>
            <p class="subtitle">Create standardized release notes instantly.</p>
        </header>

        <main>
            <section class="input-panel glass-panel">
                <h2>Release Details</h2>
                <form id="generator-form">
                    <div class="form-group">
                        <label for="branch">Branch Name <span class="required">*</span></label>
                        <input type="text" id="branch" placeholder="ex: webos4media" autocomplete="off" autofocus
                            required>
                        <span class="field-warning">⚠️ Ensure branch name is correct — entries merge by branch!</span>
                    </div>

                    <div class="form-group">
                        <label for="appName">Application Name <span class="required">*</span></label>
                        <input type="text" id="appName" placeholder="ex: notificationcenter" autocomplete="off"
                            required>
                        <span class="field-warning">⚠️ Enter only the app name (without "com.webos.app")</span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="submissionId">Submission ID</label>
                            <input type="text" id="submissionId" placeholder="submissions/123..submissions/126"
                                autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="tagHashId">BB File Tag ID</label>
                            <input type="text" id="tagHashId" placeholder="Tag ID..." autocomplete="off">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="aiCodeReviewLink">AI Code Review Link</label>
                            <input type="text" id="aiCodeReviewLink" placeholder="https://..." autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="featureBatLink">FeatureBAT Link</label>
                            <input type="text" id="featureBatLink" placeholder="https://..." autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="issues">Issue Tickets (comma separated)</label>
                        <input type="text" id="issues" placeholder="TVPLAT-123456, DITTEST-8907" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="gitlog">Git Log / Description</label>
                        <textarea id="gitlog" rows="6"
                            placeholder="123456 [FIX] fixed&#10;123456 [DEV] developed"></textarea>
                    </div>

                    <div class="actions" style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary" id="btn-submit">Submit & Merge</button>
                    </div>
                </form>
            </section>

            <section class="output-panel glass-panel">
                <div class="output-header">
                    <h2>Generated Notes</h2>
                    <div class="button-group">
                        <button id="btn-copy" class="btn-icon" title="Copy to Clipboard">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <button id="btn-download" class="btn-icon" title="Save to File">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="preview-container">
                    <pre id="message-preview" class="empty-state">Enter details to generate release notes...</pre>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
