<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
        }

        h1 {
            font-size: 24px;
            color: #58a6ff;
        }

        .btn-shutdown {
            background: #da3633;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-shutdown:hover {
            background: #f85149;
        }

        .branches {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .branch-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .branch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
        }

        .branch-name {
            font-size: 18px;
            font-weight: 600;
            color: #58a6ff;
        }

        .app-count {
            background: #238636;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .apps-list {
            padding: 16px 20px;
        }

        .app-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #0d1117;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .app-item:last-child {
            margin-bottom: 0;
        }

        .app-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .app-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .app-details span {
            background: #21262d;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .app-details .label {
            color: #7ee787;
        }

        .app-name {
            font-weight: 500;
        }

        .app-links {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .app-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 12px;
        }

        .app-links a:hover {
            text-decoration: underline;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #da3633;
            border-color: #da3633;
            color: white;
        }

        .preview-box {
            background: #010409;
            padding: 16px;
            margin: 0 20px 16px;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #a5d6ff;
            white-space: pre;
            overflow: auto;
            max-height: 200px;
            border: 1px solid #30363d;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .branch-header {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .app-item {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .card-actions {
                flex-direction: column;
            }

            .btn-copy,
            .btn-delete {
                width: 100%;
            }
        }

        .card-actions {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid #30363d;
        }

        .btn-copy {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-copy:hover {
            background: #2ea043;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #8b949e;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Admin Dashboard</h1>
        <button onclick="shutdownServer()" class="btn-shutdown">Stop Server</button>
    </div>

    <div id="branches" class="branches">
        <div class="empty-state">Loading...</div>
    </div>

    <script>
        let notesCache = {};

        async function shutdownServer() {
            if (!confirm('Stop the server?')) return;
            try {
                await fetch('/api/shutdown', { method: 'POST' });
                document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><h2>Server Stopped</h2></div>';
            } catch (err) {
                alert('Failed to shutdown');
            }
        }

        async function deleteBranch(branch) {
            if (!confirm(`Delete branch "${branch}"?`)) return;
            try {
                await fetch(`/api/admin/branch/${encodeURIComponent(branch)}`, { method: 'DELETE' });
                loadData();
            } catch (err) {
                alert('Error');
            }
        }

        async function deleteApp(branch, app) {
            if (!confirm(`Remove "${app}"?`)) return;
            try {
                await fetch(`/api/admin/branch/${encodeURIComponent(branch)}/app/${encodeURIComponent(app)}`, { method: 'DELETE' });
                loadData();
            } catch (err) {
                alert('Error');
            }
        }

        function copyNote(branch) {
            const note = notesCache[branch];
            if (!note) return;

            const textarea = document.createElement('textarea');
            textarea.value = note;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('Copied!');
            } catch (err) {
                alert('Copy failed');
            }
            document.body.removeChild(textarea);
        }

        function formatLink(url) {
            if (!url) return '';
            url = url.trim();
            if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                return 'https://' + url;
            }
            return url;
        }

        async function loadData() {
            try {
                const res = await fetch('/api/admin/data');
                const data = await res.json();
                const container = document.getElementById('branches');

                data.forEach(b => notesCache[b.branch] = b.note);

                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state">No submissions yet</div>';
                    return;
                }

                container.innerHTML = data.map(branch => `
                    <div class="branch-card">
                        <div class="branch-header">
                            <span class="branch-name">${branch.branch}</span>
                            <span class="app-count">${branch.apps.length} app(s)</span>
                        </div>
                        
                        <div class="apps-list">
                            ${branch.apps.map(app => {
                    const aiLink = formatLink(app.aiCodeReviewLink);
                    const batLink = formatLink(app.featureBatLink);
                    return `
                                <div class="app-item">
                                    <div>
                                        <div class="app-name">${app.name}</div>
                                        <div class="app-details">
                                            ${app.submissionId ? `<span><span class="label">Submission:</span> ${app.submissionId}</span>` : ''}
                                            ${app.tagHashId ? `<span><span class="label">BB Hash:</span> ${app.tagHashId}</span>` : ''}
                                        </div>
                                        <div class="app-links">
                                            ${aiLink ? `<a href="${aiLink}" target="_blank">AI Review</a>` : ''}
                                            ${batLink ? `<a href="${batLink}" target="_blank">FeatureBAT</a>` : ''}
                                        </div>
                                    </div>
                                    <button class="btn-delete" onclick="deleteApp('${branch.branch}', '${app.name}')">Remove</button>
                                </div>
                            `}).join('')}
                        </div>

                        <div class="preview-box">${branch.note}</div>
                        
                        <div class="card-actions">
                            <button class="btn-copy" onclick="copyNote('${branch.branch}')">Copy Note</button>
                            <button class="btn-delete" onclick="deleteBranch('${branch.branch}')">Delete Branch</button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
            }
        }

        loadData();
        setInterval(loadData, 5000);
    </script>
</body>

</html>
